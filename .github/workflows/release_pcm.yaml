name: Release PCM package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or redeploy
        required: true
        type: string

permissions:
  contents: read

# Keep feed rebuilds in order; a newer deployment must retain older releases.
concurrency:
  group: pcm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag
        run: |
          python -c 'import os,re; assert re.fullmatch(r"v\d+\.\d+\.\d+", os.environ["RELEASE_TAG"]), "Expected vMAJOR.MINOR.PATCH"'
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Build package
        run: python -m scripts.build_release --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
      - name: Validate official KiCad schemas
        run: |
          mkdir -p .dev/schemas
          curl --fail --location --retry 3 https://go.kicad.org/api/schemas/v1 -o .dev/schemas/api.v1.schema.json
          curl --fail --location --retry 3 https://go.kicad.org/pcm/schemas/v1 -o .dev/schemas/pcm.v1.schema.json
          python -m scripts.validate_package --schemas .dev/schemas
      - name: Publish immutable release assets
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p .dev/published
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir .dev/published
            # A redeploy can reuse a release, but must never silently replace it.
            for file in dist/*; do cmp "$file" ".dev/published/$(basename "$file")"; done
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --latest --title "KiCad Project Manager ${RELEASE_TAG}" \
              --notes-file RELEASE_NOTES.md
          fi
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build feed from published versions
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases" > .dev/releases.json
          python -m scripts.build_catalog --releases .dev/releases.json \
            --current "dist/kicad_project_manager-${RELEASE_TAG#v}.pcm.json" \
            --repository "$GITHUB_REPOSITORY" --base-url "$PAGES_URL"
          python -m scripts.validate_package --schemas .dev/schemas --site site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy PCM feed
        id: deployment
        uses: actions/deploy-pages@v4
