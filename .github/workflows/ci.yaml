name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python run_project_manager.py --version
      - name: Build PCM package
        shell: bash
        run: |
          version=$(python -c 'from project_manager import __version__; print(__version__)')
          python -m scripts.build_release --tag "v${version}"
      - name: Fetch KiCad v1 schemas
        shell: bash
        run: |
          mkdir -p .dev/schemas
          curl --fail --location --retry 3 https://go.kicad.org/api/schemas/v1 -o .dev/schemas/api.v1.schema.json
          curl --fail --location --retry 3 https://go.kicad.org/pcm/schemas/v1 -o .dev/schemas/pcm.v1.schema.json
      - run: python -m scripts.validate_package --schemas .dev/schemas
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native GUI test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-wxgtk4.0 xvfb
      - name: Exercise the window and capture it
        run: xvfb-run -a /usr/bin/python3 -m scripts.smoke_gui --output .dev/gui.png
      - uses: actions/upload-artifact@v4
        with:
          name: gui-preview
          path: .dev/gui.png
  kibot:
    name: KiBot metadata integration (KiCad 9)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out the public KDT test template
        uses: actions/checkout@v4
        with:
          repository: nguyen-v/KDT_Hierarchical_KiBot
          ref: c2cdb4242948451f3a5603813f4f55774d9e385f
          path: .dev/kdt-template
          persist-credentials: false
      - name: Prepare a disposable project through the setup editor
        run: python -m scripts.check_template prepare --template .dev/kdt-template --project .dev/ci-project
      - name: Generate metadata with the official KiCad 9 KiBot image
        run: |
          docker run --rm -v "$PWD:/work" -w /work/.dev/ci-project \
            ghcr.io/inti-cmnb/kicad9_auto_full:dev \
            sh -c 'git config --global --add safe.directory /work/.dev/ci-project && kibot -c kibot_yaml/kibot_main.yaml -b KDT_Hierarchical_KiBot.kicad_pcb -e KDT_Hierarchical_KiBot.kicad_sch -g variant=PRELIMINARY -s draw_fancy_stackup,erc,drc,update_xml,include_table md_readme'
      - name: Verify generated metadata and report
        run: python -m scripts.check_template verify --project .dev/ci-project
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kibot-metadata-report
          path: .dev/ci-project/README.md
